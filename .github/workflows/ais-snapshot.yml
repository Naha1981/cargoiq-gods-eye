name: AIS snapshot refresh
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Collect 150s of AIS
        env:
          AIS_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python3 collector/collect.py 150
      - name: Commit refreshed snapshot
        run: |
          git config user.name "NahaLabs automation"
          git config user.email "ai-solutions@nahalabs.co.za"
          git add data/vessels-snapshot.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "AIS snapshot refresh $(date -u +'%Y-%m-%d %H:%M UTC')"; git push; fi
