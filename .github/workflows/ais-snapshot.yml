name: AIS snapshot refresh
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: ais-snapshot-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # A queued run may carry an older event SHA after the previous refresh pushes.
        # Start from current main once the concurrency lock is acquired.
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - name: Collect 150s of AIS
        env:
          AIS_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python3 collector/collect.py 150
      - name: Ensure ffmpeg without blocking AIS publication
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            # Verified Linux x86_64 wheel includes a static ffmpeg binary.
            # Avoid the unavailable Ubuntu apt mirrors; hash-pin the artifact.
            echo 'imageio-ffmpeg==0.8.1 --hash=sha256:050d6850601c3b3890bd2b28306f3b842b3daea390a561101174375a1c460bda' > "$RUNNER_TEMP/ffmpeg-requirements.txt"
            if timeout 120s python3 -m pip install --disable-pip-version-check --retries 0 --timeout 30 --no-deps --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/ffmpeg-wheel" -r "$RUNNER_TEMP/ffmpeg-requirements.txt"; then
              mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
              ln -sf "$RUNNER_TEMP"/ffmpeg-wheel/imageio_ffmpeg/binaries/ffmpeg-linux-* "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
              "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -version | head -n 1
              echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
            else
              echo '::warning::Pinned ffmpeg unavailable within 120s; AIS/history/forecast still publish, existing camera images retained.'
            fi
          fi
      - name: Archive history, cameras, forecast
        run: python3 collector/archive.py
      - name: Commit refreshed snapshot
        run: |
          git config user.name "NahaLabs automation"
          git config user.email "ai-solutions@nahalabs.co.za"
          git add data/
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "AIS + evidence archive refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
